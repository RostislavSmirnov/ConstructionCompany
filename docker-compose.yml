services:
  api:
    build:
      context: .
      dockerfile: src/Presentation/ConstructionCompanyWebApi/Dockerfile
    container_name: construction-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/construction.db
    volumes:
      - ./data:/app/data